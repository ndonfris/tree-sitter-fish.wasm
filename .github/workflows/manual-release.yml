name: Manual Release

# For dev releases and manual version publishing
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 3.6.1 or use "dev" for dev release)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      publish_npm:
        description: 'Publish to NPM'
        required: false
        type: boolean
        default: false

  release:
    types: [prereleased]
    # Triggered when a pre-release is created via GitHub UI

jobs:
  manual-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Install Yarn
      run: npm install -g yarn@1.22.22

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
          IS_PRERELEASE="${{ github.event.inputs.prerelease }}"
          PUBLISH_NPM="${{ github.event.inputs.publish_npm }}"
        else
          # Extract version from pre-release tag
          VERSION="${{ github.event.release.tag_name }}"
          VERSION=${VERSION#v}
          IS_PRERELEASE="true"
          PUBLISH_NPM="false"
        fi

        # Handle "dev" keyword
        if [ "$VERSION" = "dev" ]; then
          yarn set-version --dev
          VERSION=$(yarn -s deps:check:current)
          IS_PRERELEASE="true"
        else
          yarn set-version "$VERSION"
        fi

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
        echo "publish_npm=$PUBLISH_NPM" >> $GITHUB_OUTPUT
        echo "📦 Release version: $VERSION"

    - name: Build package
      run: |
        # Ensure dependencies are built
        if [ ! -f tree-sitter-fish.wasm ]; then
          echo "Building dependencies first..."
          yarn deps:build latest
        fi

        yarn build

    - name: Run tests
      run: yarn test

    - name: Create package tarball
      run: yarn pack

    - name: Commit version changes
      if: github.event_name == 'workflow_dispatch'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add package.json last-version.txt
        git diff --staged --quiet || git commit -m "chore: release v${{ steps.version.outputs.version }}"
        git push

    - name: Create GitHub Release
      if: github.event_name == 'workflow_dispatch'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.version }}
        release_name: v${{ steps.version.outputs.version }}
        body: |
          ${{ steps.version.outputs.is_prerelease == 'true' && '🧪 Pre-release' || '🚀 Release' }} for tree-sitter-fish v${{ steps.version.outputs.version }}

          This package contains the WebAssembly build of tree-sitter-fish grammar.
        draft: false
        prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}

    - name: Publish to NPM
      if: steps.version.outputs.publish_npm == 'true'
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        if [ -z "$NODE_AUTH_TOKEN" ]; then
          echo "❌ NPM_TOKEN not set, cannot publish"
          exit 1
        fi

        if [ "${{ steps.version.outputs.is_prerelease }}" = "true" ]; then
          npm publish --access public --tag dev 
          echo "✅ Published to NPM (tag: dev)"
        else
          # npm publish --access public
          npm publish --access public --tag dev
          echo "✅ Published to NPM (tag: latest)"
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: npm-package-v${{ steps.version.outputs.version }}
        path: |
          *.tgz
          dist/
        retention-days: 30
