name: Auto-update from Upstream

# Automatically check for and publish new upstream releases
on:
  schedule:
    # Check for new releases twice weekly (Monday and Thursday at 9 AM UTC)
    - cron: '0 9 * * 1,4'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  check-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Install Yarn
      run: npm install -g yarn@1.22.22

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Check for updates
      id: version-check
      run: |
        # Use our new deps:check script
        yarn deps:check || UPDATE_AVAILABLE=$?

        if [ "$UPDATE_AVAILABLE" = "2" ]; then
          echo "update_available=true" >> $GITHUB_OUTPUT
          UPSTREAM_TAG=$(yarn -s deps:check:upstream)
          echo "upstream_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "📦 New version available: $UPSTREAM_TAG"
        else
          echo "update_available=false" >> $GITHUB_OUTPUT
          echo "✅ Already up to date"
        fi

    - name: Install build dependencies
      if: steps.version-check.outputs.update_available == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3 python3-pip
        npm install -g node-gyp

    - name: Setup Emscripten
      if: steps.version-check.outputs.update_available == 'true'
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: '3.1.45'

    - name: Build from upstream
      if: steps.version-check.outputs.update_available == 'true'
      run: |
        # Use our deps:update script
        yarn deps:update
        echo "✅ Built from upstream ${{ steps.version-check.outputs.upstream_tag }}"

    - name: Run tests
      if: steps.version-check.outputs.update_available == 'true'
      run: yarn test

    - name: Commit changes
      if: steps.version-check.outputs.update_available == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add .
        git commit -m "chore: auto-update to ${{ steps.version-check.outputs.upstream_tag }}"
        git push

    - name: Create GitHub Release
      if: steps.version-check.outputs.update_available == 'true'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version-check.outputs.upstream_tag }}
        release_name: ${{ steps.version-check.outputs.upstream_tag }}
        body: |
          🤖 Auto-generated release for tree-sitter-fish ${{ steps.version-check.outputs.upstream_tag }}

          This package contains the WebAssembly build of tree-sitter-fish grammar.

          **Upstream release:** https://github.com/ram02z/tree-sitter-fish/releases/tag/${{ steps.version-check.outputs.upstream_tag }}
        draft: false
        prerelease: false

    - name: Publish to NPM
      if: steps.version-check.outputs.update_available == 'true'
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        if [ -n "$NODE_AUTH_TOKEN" ]; then
          yarn publish --access public
          echo "✅ Published to NPM"
        else
          echo "⚠️  Skipping NPM publish (no NPM_TOKEN)"
        fi

    - name: Upload artifacts
      if: steps.version-check.outputs.update_available == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: npm-package-${{ steps.version-check.outputs.upstream_tag }}
        path: |
          *.tgz
          tree-sitter-fish.wasm
          queries/
        retention-days: 30
